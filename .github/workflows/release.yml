# Publishes airdress-home and airdress to PyPI by trusted publishing when a
# release tag `vX.Y.Z` is pushed. release-please makes that tag when its
# release PR is merged (release-please.yml), together with a draft GitHub
# release that the last job here publishes once PyPI has the version. No token exists anywhere: PyPI trusts this
# workflow file in this repository, in the `pypi` environment, for each of the
# two projects. Those two trusted publishers are configured on PyPI by an
# owner; until they are, a tag push fails at the publish step and publishes
# nothing.
name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand to ask PyPI whether a trusted publisher matches this workflow
  # before a tag is pushed. It builds and publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Exchanges this run's OIDC token at PyPI exactly as the publish action does,
  # and reports the answer. The minted token is masked and never used. PyPI
  # matches a publisher on repository, workflow file and environment, which is
  # why this lives in this file and runs in the `pypi` environment. When the
  # match is a pending publisher, PyPI creates that (empty) project on this
  # exchange, as it would on the first publish.
  check-publisher:
    name: Check the trusted publisher
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Exchange the OIDC token at PyPI
        run: |
          audience=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          echo "::add-mask::$oidc"
          body=$(jq -n --arg token "$oidc" '{token: $token}')
          answer=$(curl -sS -o /tmp/answer.json -w '%{http_code}' \
            -X POST https://pypi.org/_/oidc/mint-token -d "$body")
          if [ "$answer" = 200 ]; then
            echo "::add-mask::$(jq -r .token /tmp/answer.json)"
            echo "PyPI minted a token: a trusted publisher matches this workflow."
          else
            echo "PyPI answered $answer:"
            jq 'del(.token)' /tmp/answer.json
            exit 1
          fi
      - name: Which projects exist now
        run: |
          for project in airdress-home airdress; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/simple/$project/")
            echo "$project: /simple/ answers $code"
          done

  build:
    name: Build
    if: github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # Compared as PEP 440 versions: release-please tags `v0.1.0-b4`, and uv
      # reports the same version normalized, `0.1.0b4`.
      - name: The tag names the airdress-home version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv version --short)
          if ! uv run --quiet --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; sys.exit(Version(sys.argv[1]) != Version(sys.argv[2]))' \
            "$tag" "$version"; then
            echo "tag v$tag does not match airdress-home $version" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q tests
      - run: uv build --out-dir dist/airdress-home
      - run: uv build airdress --out-dir dist/airdress
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish-airdress-home:
    name: Publish airdress-home
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/airdress-home/

  # After airdress-home, because it depends on it.
  publish-airdress:
    name: Publish airdress
    needs: publish-airdress-home
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/airdress/
          # airdress keeps its own version (0.0.0 until its API changes); a
          # release that did not bump it is not an error.
          skip-existing: true

  # release-please created the GitHub release as a draft, so that it is only
  # shown once PyPI has the version. A tag pushed by hand has no release, and
  # this does nothing for it.
  github-release:
    name: Publish the GitHub release
    needs: [publish-airdress-home, publish-airdress]
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft || true)
          if [ "$draft" = true ]; then
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
          else
            echo "no draft release for $GITHUB_REF_NAME"
          fi
