[project]
name = "airdress-home"
version = "0.1.0b3"
description = "Link a home hub such as Home Assistant to an airdress: machine enrollment, request signing and the held channel"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Airdress", email = "support@airdress.co" }]
dependencies = [
  "aiohttp>=3.10",
  "cryptography>=43",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
keywords = ["home-assistant", "airdress", "asyncio"]

[project.urls]
Homepage = "https://airdress.co"
Source = "https://github.com/airdress-co/airdress-home"
Issues = "https://github.com/airdress-co/airdress-home/issues"

[build-system]
requires = ["hatchling>=1.27,<1.32"]  # 1.32 writes Metadata-Version 2.5, which the publish action refuses
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airdress_home"]

[tool.hatch.build.targets.sdist]
exclude = ["/airdress", "/.github"]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "ASYNC", "RUF", "SIM", "PL", "S"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLC0415"]
"airdress/tests/*" = ["S101", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "airdress/src", "airdress/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
