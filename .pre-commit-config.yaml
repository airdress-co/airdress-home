# Run with `prek run --all-files` (or pre-commit). CI runs the same.
# Hook revisions are pinned by commit SHA; the tag each one is sits beside it.
# `prek install` installs the commit-msg hook as well as the pre-commit one.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  # Commit messages are conventional commits: release-please reads them to
  # choose the next version and write CHANGELOG.md. CI runs the same checker
  # over a PR's title and commits (scripts/conventional-commits.sh, which
  # names this version and these types too). Locally a merge or a fixup!
  # commit passes; CI's check is strict and refuses a fixup! left in a PR.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        args: [build, chore, ci, deps, docs, feat, fix, perf, refactor, revert, style, test]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc # frozen: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: no-internal-refs
        name: no internal document numbers
        # This repository is public: internal process identifiers (design,
        # runbook and research-record numbers) must not appear in it.
        entry: '(?i)\b(spec|rb|rdr|rcp)[_-]?[0-9]{3}\b'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-ai-attribution
        name: no AI tool references
        entry: '(?i)\b(claude|anthropic|copilot co-authored)\b'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$
